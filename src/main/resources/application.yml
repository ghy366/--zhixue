# ===== AI 智能体助手配置（OpenAI 兼容接口）=====
# 默认接入 Intern-AI 书生·浦语 发现 API（https://discovery-api.intern-ai.org.cn/v1）。
# 该平台聚合多个模型，用统一 key 鉴权；以下是已验证可用的模型（AI_MODEL 可切换）：
#   deepseek-v4-flash-0731  轻量快、便宜、中文好（默认）
#   deepseek-v4-pro-0813    更强推理
#   glm-5.3 / qwen3.8-27b / kimi-k2.6 / minimax-m3 / intern-s2（书生·S2） 等
# 仍可用环境变量 AI_BASE_URL / AI_API_KEY / AI_MODEL 覆盖（便于本地不提交密钥）。
ai:
  base-url: ${AI_BASE_URL:https://discovery-api.intern-ai.org.cn/v1}
  api-key: ${AI_API_KEY:sk-e9c00dd160dd43ca8c4c551baecbf5faff899fcb17ab60eb304892883a263cd5}
  model: ${AI_MODEL:deepseek-v4-flash-0731}
  # 主通道失败（额度用尽/限流/网络异常）时自动回退的免费兜底通道，保证始终能聊
  fallback-base-url: ${AI_FALLBACK_BASE_URL:https://text.pollinations.ai/v1}
